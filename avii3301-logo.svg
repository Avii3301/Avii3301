<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <!-- Horizontal stripe pattern — thick red bars with dark gaps, just like the Mr. Robot logo -->
    <pattern id="redStripes" x="0" y="0" width="900" height="9" patternUnits="userSpaceOnUse">
      <rect width="900" height="6" fill="#E8272A"/>
      <rect y="6" width="900" height="3" fill="#080000"/>
    </pattern>

    <!-- Clip the stripes to the text shape -->
    <clipPath id="textClip">
      <text
        x="450"
        y="172"
        font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif"
        font-size="165"
        font-weight="900"
        text-anchor="middle"
        letter-spacing="6">AVII3301</text>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="#080000"/>

  <!-- Striped fill clipped to letterforms -->
  <rect width="900" height="220" fill="url(#redStripes)" clip-path="url(#textClip)"/>
</svg>
