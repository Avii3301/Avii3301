<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>AVII'S ARCADE</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #00FF41;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* CRT scanlines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.18) 0px,
        rgba(0,0,0,0.18) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 999;
    }

    /* CRT vignette */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
      z-index: 998;
    }

    .title {
      font-size: clamp(16px, 4vw, 28px);
      color: #00FF41;
      text-shadow: 0 0 8px #00FF41, 0 0 20px #00FF41;
      letter-spacing: 6px;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: clamp(6px, 1.5vw, 9px);
      color: #006400;
      letter-spacing: 4px;
      margin-bottom: 14px;
    }

    .hud {
      display: flex;
      gap: 40px;
      font-size: clamp(7px, 1.5vw, 10px);
      margin-bottom: 8px;
      color: #00FF41;
    }

    .screen-wrap {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid #00FF41;
      box-shadow: 0 0 16px #00FF41, 0 0 40px rgba(0,255,65,0.25), inset 0 0 40px rgba(0,0,0,0.5);
      background: #000;
      max-width: 100vw;
    }

    /* Overlay */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    #overlay h2 {
      font-size: clamp(14px, 3vw, 22px);
      color: #00FF41;
      text-shadow: 0 0 10px #00FF41;
    }
    #overlay .score-display {
      font-size: clamp(8px, 1.8vw, 11px);
      color: #39FF14;
    }
    #overlay .prompt {
      font-size: clamp(7px, 1.5vw, 10px);
      color: #39FF14;
      animation: blink 1s step-end infinite;
    }
    .legend {
      margin-top: 16px;
      font-size: clamp(6px, 1.2vw, 8px);
      color: #004d00;
      display: flex;
      gap: 24px;
    }
    .score-table {
      margin-top: 6px;
      font-size: clamp(6px, 1.2vw, 8px);
      color: #006400;
      display: flex;
      gap: 30px;
    }
    .footer {
      margin-top: 8px;
      font-size: clamp(5px, 1vw, 7px);
      color: #002800;
      letter-spacing: 2px;
    }

    /* Touch controls */
    .touch-controls {
      display: none;
      margin-top: 14px;
      gap: 12px;
      align-items: center;
      z-index: 100;
    }
    .touch-btn {
      background: rgba(0, 255, 65, 0.12);
      border: 2px solid #00FF41;
      color: #00FF41;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(12px, 3vw, 18px);
      padding: 14px 20px;
      border-radius: 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .touch-btn:active {
      background: rgba(0, 255, 65, 0.35);
      box-shadow: 0 0 12px #00FF41;
    }
    .touch-btn-fire {
      padding: 14px 28px;
      font-size: clamp(9px, 2vw, 12px);
    }

    @media (pointer: coarse) {
      .touch-controls { display: flex; }
      .legend { display: none; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

<div class="title">AVII'S ARCADE</div>
<div class="subtitle">— SPACE INVADERS —</div>

<div class="hud">
  <span>SCORE: <span id="scoreEl">0</span></span>
  <span>HI: <span id="hiEl">0</span></span>
  <span>LIVES: <span id="livesEl">♥ ♥ ♥</span></span>
</div>

<div class="screen-wrap">
  <canvas id="c" width="560" height="380"></canvas>
  <div id="overlay">
    <h2 id="ovTitle">AVII'S ARCADE</h2>
    <div class="score-display" id="ovScore" style="display:none"></div>
    <div class="prompt" id="ovPrompt">PRESS SPACE TO START</div>
  </div>
</div>

<div class="touch-controls" id="touchControls">
  <button class="touch-btn" id="btnLeft">◀</button>
  <button class="touch-btn touch-btn-fire" id="btnFire">FIRE</button>
  <button class="touch-btn" id="btnRight">▶</button>
</div>

<div class="legend">
  <span>← → / A D — MOVE</span>
  <span>SPACE — SHOOT</span>
  <span>P — PAUSE</span>
</div>
<div class="score-table">
  <span>▲ = 30pts</span>
  <span>■ = 20pts</span>
  <span>▼ = 10pts</span>
</div>
<div class="footer">© AVII3301 · BUILT WITH ♥ &amp; TOO MUCH COFFEE</div>

<script>
  // ── Audio engine (Web Audio API — no files needed) ──────────
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
  }
  function beep(freq, dur, type = 'square', vol = 0.08) {
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  }
  function sfxShoot()   { beep(880, 0.08, 'square', 0.06); }
  function sfxKill()    { beep(220, 0.15, 'sawtooth', 0.07); beep(440, 0.1, 'square', 0.05); }
  function sfxHit()     { beep(110, 0.3, 'sawtooth', 0.1); }
  function sfxGameOver(){ beep(200, 0.2, 'sawtooth', 0.1); setTimeout(()=>beep(140,0.3,'sawtooth',0.1), 200); setTimeout(()=>beep(80,0.5,'sawtooth',0.1), 450); }

  // ── Canvas ──────────────────────────────────────────────────
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const G   = '#00FF41';
  const BG  = '#39FF14';
  const DG  = '#006400';
  const RED = '#FF4136';

  // HUD refs
  const scoreEl  = document.getElementById('scoreEl');
  const hiEl     = document.getElementById('hiEl');
  const livesEl  = document.getElementById('livesEl');
  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('ovTitle');
  const ovScore  = document.getElementById('ovScore');
  const ovPrompt = document.getElementById('ovPrompt');

  let hiScore = 0;
  try { hiScore = parseInt(localStorage.getItem('avii_hi') || '0'); } catch(e) {}
  hiEl.textContent = hiScore;

  // ── Game state ──────────────────────────────────────────────
  let state = 'idle';
  let score, lives, level;
  let raf;
  let invincibleT = 0; // invincibility frames after hit

  // ── Input ───────────────────────────────────────────────────
  const keys = {};
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space') onAction();
    if (e.code === 'KeyP')  onPause();
  });
  document.addEventListener('keyup', e => { keys[e.code] = false; });

  function onAction() {
    if (state === 'idle' || state === 'over') { startGame(); return; }
    if (state === 'playing') tryShoot();
    if (state === 'paused') resumeGame();
  }
  function onPause() {
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }

  // ── Touch controls ──────────────────────────────────────────
  function bindTouch(id, code) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); keys[code] = true; if (code === 'Space') onAction(); });
    el.addEventListener('touchend',   e => { e.preventDefault(); keys[code] = false; });
    el.addEventListener('mousedown',  e => { keys[code] = true; if (code === 'Space') onAction(); });
    el.addEventListener('mouseup',    e => { keys[code] = false; });
  }
  bindTouch('btnLeft',  'ArrowLeft');
  bindTouch('btnRight', 'ArrowRight');
  bindTouch('btnFire',  'Space');

  // Tap canvas to start on mobile
  canvas.addEventListener('touchstart', e => { e.preventDefault(); if (state !== 'playing') onAction(); });

  // ── Player ──────────────────────────────────────────────────
  const PW = 38, PH = 18;
  let px, py, pCool;
  let pBullets = [];

  function resetPlayer() {
    px = W / 2 - PW / 2;
    py = H - 52;
    pCool = 0;
    pBullets = [];
    invincibleT = 0;
  }

  // ── Aliens ──────────────────────────────────────────────────
  const ACOLS = 8, AROWS = 3;
  const AW = 34, AH = 22, AGAPX = 12, AGAPY = 14;
  let aliens = [], aDir, aStepDown, aMoveT, aMoveInterval, aFrame;
  let aBullets = [], aShootT;
  const POINTS = [30, 20, 10];

  function initAliens() {
    aliens = [];
    const ox = (W - ACOLS * (AW + AGAPX) + AGAPX) / 2;
    const oy = 52;
    for (let r = 0; r < AROWS; r++) {
      for (let c = 0; c < ACOLS; c++) {
        aliens.push({ x: ox + c*(AW+AGAPX), y: oy + r*(AH+AGAPY), r, alive: true, frame: 0 });
      }
    }
    aDir = 1; aStepDown = false;
    aMoveT = 0; aShootT = 0;
    aMoveInterval = Math.max(8, 55 - (level-1) * 7);
    aFrame = 0;
    aBullets = [];
  }

  // ── Barriers ────────────────────────────────────────────────
  const BLK = 7;
  let barriers = [];

  function initBarriers() {
    barriers = [];
    const count = 4, bw = BLK*7;
    const gap = (W - count*bw) / (count+1);
    for (let i = 0; i < count; i++) {
      const bx = gap + i*(bw+gap), by = H - 90;
      const blocks = [];
      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 7; col++) {
          if (row === 3 && col >= 2 && col <= 4) continue;
          if (row === 0 && (col === 0 || col === 6)) continue;
          blocks.push({ x: bx+col*BLK, y: by+row*BLK, alive: true });
        }
      }
      barriers.push(blocks);
    }
  }

  // ── Particles ───────────────────────────────────────────────
  let particles = [];

  function spawnExplosion(cx, cy, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 18 + Math.floor(Math.random() * 14),
        maxLife: 32,
        size: 2 + Math.random() * 3,
        color
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    particles.forEach(p => {
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 4;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }

  // ── Collisions ──────────────────────────────────────────────
  function hit(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }

  // ── Drawing ─────────────────────────────────────────────────
  function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
  function noGlow() { ctx.shadowBlur = 0; }

  function drawPlayer() {
    if (invincibleT > 0 && Math.floor(invincibleT / 3) % 2 === 0) return; // blink
    ctx.fillStyle = G;
    glow(G, 10);
    ctx.fillRect(px,    py+10, PW, 8);
    ctx.fillRect(px+11, py+2,  16, 10);
    ctx.fillRect(px+16, py-4,  6,  6);
    ctx.fillRect(px+4,  py+18, 7,  3);
    ctx.fillRect(px+27, py+18, 7,  3);
    noGlow();
  }

  function drawAlien(a) {
    if (!a.alive) return;
    const { x, y, r, frame: f } = a;
    ctx.fillStyle = r === 0 ? BG : G;
    glow(G, 5);
    if (r === 0) {
      ctx.fillRect(x+8,y,18,4); ctx.fillRect(x+2,y+4,30,4); ctx.fillRect(x,y+8,34,6);
      ctx.fillRect(x+2,y+14,7,4); ctx.fillRect(x+25,y+14,7,4);
      if(f===0){ctx.fillRect(x,y+10,4,3);ctx.fillRect(x+30,y+10,4,3);}
      else     {ctx.fillRect(x+4,y+10,4,3);ctx.fillRect(x+26,y+10,4,3);}
    } else if (r === 1) {
      ctx.fillRect(x+10,y,14,4); ctx.fillRect(x+4,y+4,26,8); ctx.fillRect(x,y+12,34,4);
      ctx.fillRect(x+4,y+16,6,4); ctx.fillRect(x+24,y+16,6,4);
      if(f===0){ctx.fillRect(x,y+8,4,4);ctx.fillRect(x+30,y+8,4,4);}
      else     {ctx.fillRect(x+2,y+6,4,4);ctx.fillRect(x+28,y+6,4,4);}
    } else {
      ctx.fillRect(x+6,y,22,4); ctx.fillRect(x+2,y+4,30,10);
      ctx.fillRect(x+6,y+14,8,4); ctx.fillRect(x+20,y+14,8,4);
      if(f===0){ctx.fillRect(x,y+8,5,4);ctx.fillRect(x+29,y+8,5,4);}
      else     {ctx.fillRect(x+2,y+6,5,4);ctx.fillRect(x+27,y+6,5,4);}
    }
    noGlow();
  }

  function drawBullet(b, color) {
    ctx.fillStyle = color; glow(color, 6);
    ctx.fillRect(b.x, b.y, b.w, b.h);
    noGlow();
  }

  function drawBarriers() {
    barriers.forEach(blocks => {
      blocks.forEach(b => { if (!b.alive) return; ctx.fillStyle = DG; ctx.fillRect(b.x, b.y, BLK, BLK); });
    });
  }

  function drawGroundLine() { ctx.fillStyle = DG; ctx.fillRect(0, H-40, W, 2); }

  function drawLevelBadge() {
    ctx.fillStyle = DG;
    ctx.font = '7px "Press Start 2P"';
    ctx.textAlign = 'right';
    ctx.fillText('LV ' + level, W-8, H-18);
    ctx.textAlign = 'left';
  }

  // ── Shooting ────────────────────────────────────────────────
  function tryShoot() {
    if (pCool > 0 || pBullets.length >= 2) return;
    pBullets.push({ x: px+PW/2-2, y: py-8, w: 4, h: 12, speed: 8 });
    pCool = 14;
    sfxShoot();
  }

  function alienShoot() {
    const alive = aliens.filter(a => a.alive);
    if (!alive.length) return;
    const front = {};
    alive.forEach(a => { const col = Math.round(a.x); if(!front[col]||a.y>front[col].y) front[col]=a; });
    const shooters = Object.values(front);
    const s = shooters[Math.floor(Math.random() * shooters.length)];
    aBullets.push({ x: s.x+AW/2-2, y: s.y+AH, w: 4, h: 10, speed: 2.8+level*0.4 });
  }

  // ── Update (all splice loops iterate in reverse) ────────────
  function update() {
    // Player movement
    const spd = 5;
    if ((keys['ArrowLeft']||keys['KeyA']) && px > 0)    px -= spd;
    if ((keys['ArrowRight']||keys['KeyD']) && px < W-PW) px += spd;
    if (pCool > 0) pCool--;
    if (invincibleT > 0) invincibleT--;

    // Move player bullets
    for (let i = pBullets.length - 1; i >= 0; i--) {
      pBullets[i].y -= pBullets[i].speed;
      if (pBullets[i].y + pBullets[i].h < 0) pBullets.splice(i, 1);
    }

    // Alien grid movement
    aMoveT++;
    if (aMoveT >= aMoveInterval) {
      aMoveT = 0;
      aFrame = 1 - aFrame;
      aliens.forEach(a => { if (a.alive) a.frame = aFrame; });
      const alive = aliens.filter(a => a.alive);
      if (!alive.length) return;

      if (aStepDown) {
        aStepDown = false;
        aDir *= -1;
        alive.forEach(a => { a.y += 18; });
        if (Math.max(...alive.map(a => a.y+AH)) >= py) { doGameOver(); return; }
      } else {
        const step = 10 + level * 2;
        const right = Math.max(...alive.map(a => a.x+AW));
        const left  = Math.min(...alive.map(a => a.x));
        if ((aDir>0 && right+step > W-8) || (aDir<0 && left-step < 8)) {
          aStepDown = true;
        } else {
          alive.forEach(a => { a.x += aDir * step; });
        }
      }
      const pct = alive.length / (AROWS*ACOLS);
      if (pct < 0.3) aMoveInterval = Math.max(5, aMoveInterval - 1);
    }

    // Alien shooting
    aShootT++;
    if (aShootT >= Math.max(25, 75 - level*8)) {
      aShootT = 0;
      if (Math.random() < 0.75) alienShoot();
    }

    // Move alien bullets
    for (let i = aBullets.length - 1; i >= 0; i--) {
      aBullets[i].y += aBullets[i].speed;
      if (aBullets[i].y > H) aBullets.splice(i, 1);
    }

    // Player bullets vs aliens (reverse iteration)
    for (let bi = pBullets.length - 1; bi >= 0; bi--) {
      const b = pBullets[bi];
      if (!b) continue;
      let hitSomething = false;
      for (let ai = 0; ai < aliens.length; ai++) {
        const a = aliens[ai];
        if (!a.alive) continue;
        if (hit(b.x, b.y, b.w, b.h, a.x, a.y, AW, AH)) {
          a.alive = false;
          pBullets.splice(bi, 1);
          score += POINTS[a.r];
          if (score > hiScore) { hiScore = score; try{localStorage.setItem('avii_hi',hiScore);}catch(e){} }
          scoreEl.textContent = score;
          hiEl.textContent = hiScore;
          aMoveInterval = Math.max(5, aMoveInterval - 1);
          spawnExplosion(a.x + AW/2, a.y + AH/2, a.r === 0 ? BG : G, 12);
          sfxKill();
          hitSomething = true;
          break;
        }
      }
      if (hitSomething) continue;
      // Player bullets vs barriers
      for (let gi = 0; gi < barriers.length && pBullets[bi]; gi++) {
        const blocks = barriers[gi];
        for (let ki = 0; ki < blocks.length; ki++) {
          if (!blocks[ki].alive) continue;
          if (hit(b.x, b.y, b.w, b.h, blocks[ki].x, blocks[ki].y, BLK, BLK)) {
            blocks[ki].alive = false;
            pBullets.splice(bi, 1);
            break;
          }
        }
      }
    }

    // Alien bullets vs barriers (reverse iteration)
    for (let bi = aBullets.length - 1; bi >= 0; bi--) {
      const b = aBullets[bi];
      if (!b) continue;
      let removed = false;
      for (let gi = 0; gi < barriers.length && !removed; gi++) {
        const blocks = barriers[gi];
        for (let ki = 0; ki < blocks.length; ki++) {
          if (!blocks[ki].alive) continue;
          if (hit(b.x, b.y, b.w, b.h, blocks[ki].x, blocks[ki].y, BLK, BLK)) {
            blocks[ki].alive = false;
            aBullets.splice(bi, 1);
            removed = true;
            break;
          }
        }
      }
    }

    // Alien bullets vs player (reverse iteration + invincibility)
    if (invincibleT <= 0) {
      for (let bi = aBullets.length - 1; bi >= 0; bi--) {
        const b = aBullets[bi];
        if (hit(b.x, b.y, b.w, b.h, px+4, py, PW-8, PH)) {
          aBullets.splice(bi, 1);
          lives--;
          livesEl.textContent = lives > 0 ? '♥ '.repeat(lives).trim() : '';
          invincibleT = 90; // ~1.5 seconds of invincibility
          sfxHit();
          spawnExplosion(px + PW/2, py + PH/2, RED, 8);
          if (lives <= 0) { doGameOver(); return; }
          break; // only one hit per frame
        }
      }
    }

    // Particles
    updateParticles();

    // Win check
    if (aliens.every(a => !a.alive)) {
      level++;
      initAliens();
      pBullets = [];
      aBullets = [];
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000305';
    ctx.fillRect(0, 0, W, H);

    drawGroundLine();
    drawBarriers();
    aliens.forEach(drawAlien);
    pBullets.forEach(b => drawBullet(b, G));
    aBullets.forEach(b => drawBullet(b, RED));
    drawPlayer();
    drawParticles();
    drawLevelBadge();
  }

  // ── Game flow ───────────────────────────────────────────────
  function startGame() {
    ensureAudio();
    if (raf) cancelAnimationFrame(raf);
    score = 0; lives = 3; level = 1;
    particles = [];
    scoreEl.textContent = 0;
    livesEl.textContent = '♥ ♥ ♥';
    resetPlayer();
    initAliens();
    initBarriers();
    state = 'playing';
    overlay.style.display = 'none';
    loop();
  }

  function pauseGame() {
    state = 'paused';
    cancelAnimationFrame(raf);
    ovTitle.textContent  = 'PAUSED';
    ovScore.style.display = 'none';
    ovPrompt.textContent = 'PRESS SPACE / P TO RESUME';
    overlay.style.display = 'flex';
  }

  function resumeGame() {
    state = 'playing';
    overlay.style.display = 'none';
    loop();
  }

  function doGameOver() {
    state = 'over';
    cancelAnimationFrame(raf);
    sfxGameOver();
    ovTitle.textContent  = 'GAME OVER';
    ovScore.style.display = 'block';
    ovScore.textContent  = 'SCORE: ' + score;
    ovPrompt.textContent = 'PRESS SPACE TO RETRY';
    overlay.style.display = 'flex';
  }

  function loop() {
    if (state !== 'playing') return;
    update();
    draw();
    raf = requestAnimationFrame(loop);
  }

  // Initial background render
  draw();
</script>
</body>
</html>
